services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - rideon-mongo:/data/db

  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 5000
      CLIENT_URL: http://localhost
      MONGODB_URI: mongodb://mongo:27017/rideon
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: 7d
    depends_on:
      - mongo
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  rideon-mongo:
